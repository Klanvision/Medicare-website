<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Premium Medical Blue Gradient -->
    <linearGradient id="medicareBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#034574"/>
    </linearGradient>

    <!-- Soft Medical Teal Gradient -->
    <linearGradient id="medicareTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Ice Tint Gradient -->
    <linearGradient id="iceShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Outer Healthcare Shield Base -->
    <path d="M 256 40 C 330 40 420 72 420 160 C 420 290 310 410 256 460 C 202 410 92 290 92 160 C 92 72 182 40 256 40 Z" fill="url(#iceShield)" stroke="url(#medicareBlue)" stroke-width="16" />

    <!-- Stylized 'M' Wings + Medical Care Arc (Medical Blue) -->
    <path d="M 160 280 L 160 170 C 160 145 180 135 200 155 L 256 220 L 312 155 C 332 135 352 145 352 170 L 352 280 C 352 295 338 305 324 295 C 310 285 304 265 304 245 L 304 210 L 270 250 C 262 260 250 260 242 250 L 208 210 L 208 245 C 208 265 202 285 188 295 C 174 305 160 295 160 280 Z" fill="url(#medicareBlue)"/>

    <!-- Central Medical Cross (+) Emblem (Soft Medical Teal) -->
    <g transform="translate(256, 335)">
      <rect x="-10" y="-30" width="20" height="60" rx="6" fill="url(#medicareTeal)" />
      <rect x="-30" y="-10" width="60" height="20" rx="6" fill="url(#medicareTeal)" />
    </g>

    <!-- Vibrant Pulse Heartbeat Line -->
    <path d="M 120 220 L 175 220 L 195 175 L 215 255 L 235 200 L 250 225 L 265 200 L 285 245 L 305 190 L 325 220 L 392 220" stroke="url(#medicareTeal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
  </g>
</svg>
