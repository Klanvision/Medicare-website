<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C20"/>
      <stop offset="100%" stop-color="#0F2744"/>
    </linearGradient>

    <!-- Vibrant Cyan Teal Gradient for Emblem -->
    <linearGradient id="tealGradVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Glowing Metallic Gold Gradient for Accents -->
    <linearGradient id="goldGradVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Glowing Gold Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#goldGradVibrant)" stroke-width="12" stroke-opacity="0.9" fill="none"/>

  <!-- Outer Protective Halo Arc -->
  <path d="M 256 64 C 400 64 456 160 432 300 C 412 390 344 448 256 456" stroke="url(#goldGradVibrant)" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#glowEffect)"/>

  <!-- Top Tilak Symbol -->
  <circle cx="256" cy="52" r="14" fill="url(#goldGradVibrant)" />
  <path d="M 224 80 C 246 94 266 94 288 80 C 272 87 240 87 224 80 Z" fill="url(#goldGradVibrant)" />

  <!-- Lord Ganesha & Healthcare Silhouette (Vibrant Cyan Teal) -->
  <path d="M 256 98 C 188 98 140 130 130 196 C 120 262 182 302 192 238 C 197 206 220 174 256 154 C 292 134 318 154 326 190 C 334 230 308 280 248 326 C 210 356 164 364 138 338 C 184 390 240 416 274 398 C 318 372 350 314 338 238 C 324 162 298 98 256 98 Z" fill="url(#tealGradVibrant)" filter="url(#glowEffect)" />

  <!-- Eye Arc Detail -->
  <path d="M 240 194 C 252 184 264 188 270 198" stroke="url(#goldGradVibrant)" stroke-width="9" stroke-linecap="round" fill="none" />

  <!-- Bright Medical Cross Emblem -->
  <g transform="translate(270, 290)">
    <rect x="-12" y="-32" width="24" height="64" rx="8" fill="#FFFFFF" />
    <rect x="-32" y="-12" width="64" height="24" rx="8" fill="#FFFFFF" />
    <rect x="-8" y="-28" width="16" height="56" rx="5" fill="url(#goldGradVibrant)" />
    <rect x="-28" y="-8" width="56" height="16" rx="5" fill="url(#goldGradVibrant)" />
  </g>
</svg>
